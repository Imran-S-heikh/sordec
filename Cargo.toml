[workspace]
resolver = "2"
members = [
    "crates/sordec-common",
    "crates/sordec-ir",
    "crates/sordec-sigs",
    "crates/sordec-frontend",
    "crates/sordec-passes",
    "crates/sordec-backend",
    "crates/sordec-driver",
    "crates/sordec-score",
    "crates/sordec-diffexec",
    "crates/sordec",
]
# Vendored fixture sources under `samples/contracts/<name>/source/` are
# self-contained crates pinned to specific soroban-sdk + rustc versions for
# reproducible WASM. They are NOT part of our build — `cargo build --workspace`
# must skip them, and a `cargo` invocation from inside a fixture's `source/`
# directory must not adopt this workspace as its parent. The exclude here is
# belt-and-braces with each fixture's own empty `[workspace]` declaration.
exclude = ["samples"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
# The real floor, and it is set by our dependencies rather than by our code.
#
# Three floors stack here, and only the highest is declarable:
#   1.85  edition 2024
#   1.87  `u64::is_multiple_of` (`passes/src/ledger.rs`) — our own code's floor.
#         Declaring 1.85 made `clippy::incompatible_msrv` fail the gate the
#         first time this field existed, which is precisely what it is for.
#   1.91  `soroban-spec` / `soroban-meta` 25.3.x, which declare it themselves.
#
# So 1.87 was a promise we could not keep: `cargo +1.87 check --workspace`
# fails during *resolution*, before compiling anything, with "rustc 1.87.0 is
# not supported by the following packages". The CI `msrv` job is what catches
# that, and it caught it the first time it ran.
#
# Not to be confused with `sordec-diffexec`'s `RECONSTRUCTION_CHANNEL` (1.89),
# which is the toolchain we *recompile decompiled contracts with*. That one is
# pinned to match the SDK the corpus was built against and is unrelated to what
# builds sordec itself.
#
# Raise this when a newer API is adopted or a dependency raises its own floor;
# do not lower it without running `cargo +<version> check --workspace
# --all-targets`, which is the only check that sees the dependency floor.
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Imran Shaikh"]
repository = "https://github.com/Imran-S-heikh/sordec"
readme = "README.md"
description = "Soroban WASM-to-Rust decompiler"
keywords = ["soroban", "stellar", "decompiler", "wasm", "webassembly"]
categories = ["development-tools", "compilers", "wasm"]

[workspace.dependencies]
# Internal crates.
#
# Both `path` and `version` are required. `path` is what the workspace builds
# against; `version` is what a published dependent would resolve, and a registry
# refuses a manifest without one:
#
#     error: all dependencies must have a version requirement specified when publishing
#
# Exact-pinned (`=`) because these move in lockstep with `workspace.package.version`
# and because prerelease matching is strict — a plain `0.1.0-alpha.1` requirement
# would not accept a later `0.1.0-alpha.2`, so the pin states the real constraint
# rather than implying a range we do not support.
sordec-common   = { path = "crates/sordec-common",   version = "=0.1.0-alpha.1" }
sordec-ir       = { path = "crates/sordec-ir",       version = "=0.1.0-alpha.1" }
sordec-sigs     = { path = "crates/sordec-sigs",     version = "=0.1.0-alpha.1" }
sordec-frontend = { path = "crates/sordec-frontend", version = "=0.1.0-alpha.1" }
sordec-passes   = { path = "crates/sordec-passes",   version = "=0.1.0-alpha.1" }
sordec-backend  = { path = "crates/sordec-backend",  version = "=0.1.0-alpha.1" }
sordec-driver   = { path = "crates/sordec-driver",   version = "=0.1.0-alpha.1" }
sordec-score    = { path = "crates/sordec-score",    version = "=0.1.0-alpha.1" }
sordec-diffexec = { path = "crates/sordec-diffexec", version = "=0.1.0-alpha.1" }

# External crates — pinned to exact versions we've validated
wasmparser    = "0.240"
wasmprinter   = "0.240"
wat           = "1.240"
waffle        = "0.2.0"
soroban-spec  = "25.3.0"
soroban-meta  = "25.3.0"
stellar-xdr   = { version = "=25.0.0", default-features = false, features = ["curr", "std"] }
syn           = { version = "2.0", features = ["full", "visit-mut"] }
quote         = "1.0"
proc-macro2   = "1.0"
prettyplease  = "0.2"
thiserror     = "2.0"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
toml          = "0.8"
clap          = { version = "4.5", features = ["derive"] }

# CLI integration testing — used only as a dev-dependency from
# `crates/sordec/tests/`. Pulled into the workspace so the version
# pin lives in one place.
assert_cmd    = "2.0"
predicates    = "3.1"

# In-process contract execution — a real dependency of
# `crates/sordec-diffexec/`, whose job is running both sides in a host.
# `testutils` is what provides `Env`, contract registration from raw wasm bytes,
# and the auth/event/ledger introspection the behavior harness compares.
#
# It was a dev-dependency until 2026-07-28 on the belief that `-D warnings` in
# `gate.sh` step 2 would fail the vendored `soroban-wasmi`. Measured false —
# registry dependencies are `--cap-lints allow`, so RUSTFLAGS cannot fail them.
# The real hazard is the lockfile pin below, not the lint level.
#
# CAUTION — this dependency carries a lockfile constraint that a plain
# `cargo update` will break. `soroban-env-host` declares
# `ed25519-dalek = ">=2.0.0"` (its Cargo.toml:133-134), unbounded across majors,
# so the resolver picks 3.0.0, whose reworked `CryptoRng` bound then fails to
# compile inside the host's own `builtin_contracts/testutils.rs`.
#
# A manifest bound here cannot fix it: `>=2.0.0` spans majors, so cargo is
# entitled to keep a 3.0.0 node for the host alongside whatever we ask for.
# The only mechanism that constrains the host's own node is the committed
# `Cargo.lock`. If the build ever fails with
# `ChaCha20Rng: ed25519_dalek::rand_core::CryptoRng is not satisfied`, restore it:
#
#     cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0
#
# `curve25519-dalek` needs no separate pin — `ed25519-dalek 2.2` bounds it to 4.x.
# `sordec-diffexec`'s `lockfile` test asserts this so a stray update fails loudly
# rather than surfacing as a mystery compile error in the host graph.
soroban-sdk       = { version = "23.5.3", features = ["testutils"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Workspace-wide lint policy.
#
# Locked-in conventions for sordec — see docs/architecture.md §11 and the
# Task 1.2 plan. Every member crate inherits these via `[lints] workspace = true`.
[workspace.lints.rust]
# We never need raw unsafe; if we ever do, an explicit `#[allow(unsafe_code)]`
# at the call site forces a code-review checkpoint.
unsafe_code = "deny"
# Public items must be documented. Type-only crates without doc comments are
# unreviewable; this turns each `///` into a contract.
missing_docs = "deny"

[workspace.lints.clippy]
# `dbg!` printing in release code is always a mistake. Forbidden so that
# the legacy `format!("{op:?}").split(...)` style of opcode-name extraction
# can never sneak back in via debug formatting.
dbg_macro = "deny"
# `print!`/`println!`/`eprintln!` go through the project's diagnostic
# infrastructure (later); raw stdout in library crates is a smell.
print_stdout = "warn"
print_stderr = "warn"
# `todo!()` is fine in scaffolding but should never reach a release.
todo = "warn"
