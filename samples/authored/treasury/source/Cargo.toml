[package]
name = "treasury"
description = "Community treasury: members propose payments and settings, vote, and the admin executes what passed"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "=23.0.1" }

[dev-dependencies]
soroban-sdk = { version = "=23.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
