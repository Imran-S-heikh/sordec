# CI mirrors `tools/gate.sh`, which is the local gate contributors run before
# pushing. The two must not drift: if a *gate step* is added here it belongs
# there too, and vice versa. The gate script is the source of truth; this file
# exists so the same six steps run on a machine nobody has configured by hand.
#
# Provisioning steps are the deliberate exception, and always have been — the
# toolchain install and the caches below have no `gate.sh` counterpart either.
# A human runs `tools/setup-toolchains.sh` once; a fresh runner has to be told
# every time. `gate.sh` states the reason from the other side: machine state is
# not repo content, and a gate that fails because a colleague hasn't installed
# a target teaches people to skip the gate. So do not "fix" this drift.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning everywhere, not just where the gate sets it explicitly.
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    name: gate (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # `rust-toolchain.toml` pins the channel; this action honours it, so the
      # version here is deliberately unstated rather than duplicated.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Restores `~/.cargo` (registry *and* installed binaries) before the
      # provisioning step, so an already-cached `cargo-expand` is found and the
      # install below is skipped rather than recompiled.
      - uses: Swatinem/rust-cache@v2

      # The gate scores the corpus on the macro-expanded basis the RFP
      # mandates, and the accuracy bands are derived there. Without
      # `cargo-expand` and a warm registry, scoring silently falls back to the
      # source basis and three of seven fixtures breach their band — measured,
      # not hypothetical. `--scoring-only` skips the wasm toolchain, which only
      # the `#[ignore]`d differential-execution tests need.
      #
      # `RUSTFLAGS` is cleared for this step alone: the workspace-wide
      # `-D warnings` is a policy for *our* code, and applying it to a
      # third-party `cargo install` fails the build on someone else's warning.
      #
      # The expansion build directory (`SORDEC_EXPAND_TARGET_DIR`) is left at its
      # default under the system temp dir, i.e. cold on every run. That is a
      # deliberate non-optimisation: measured, the directory reaches **2.4 GB** and
      # a cold corpus expansion costs ~168 s, so caching it would spend most of
      # that saving on transfer and burn the repo's shared 10 GB cache budget —
      # which `Swatinem/rust-cache` puts to much better use.
      - name: Provision the scoring harness
        run: bash tools/setup-toolchains.sh --scoring-only
        env:
          RUSTFLAGS: ""

      # Runs the same script contributors run, so a green CI means a green
      # local gate and there is exactly one definition of "passing".
      - name: tools/gate.sh
        run: bash tools/gate.sh

  msrv:
    name: msrv (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The declared MSRV is a promise to anyone building this. Reading it from
      # the manifest rather than hard-coding it here means the promise cannot
      # drift from the thing that states it.
      - name: Read declared MSRV
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"

      - name: Install declared MSRV
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Build only — the test suite is the stable job's business. This job
      # answers one question: does the version we advertise actually compile it?
      - name: cargo check on MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets

  heldout:
    name: held-out corpus (regression guard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A job of its own rather than a step in `gate`, because the header
      # above is a rule: the `gate` job mirrors `tools/gate.sh` and nothing
      # else. This guard cannot live in that script — it needs a corpus that
      # is not repo content, and `gate.sh` is deliberately allowed to assume
      # nothing about machine state. `msrv` and `publish-readiness` already
      # answer questions the gate does not, so a fourth job is the shape this
      # file already has.
      #
      # What it guards: `samples/contracts` is what every recognizer was built
      # against, so the accuracy bands there cannot see a change that helps
      # the corpus and breaks everything else. Measured twice: a change landed
      # with the corpus green at 0.9359 while three held-out contracts fell
      # from 1.0000 to 0.7059.
      #
      # The full provisioning, not `--scoring-only`: the bench needs
      # `cargo-expand` for the macro-expanded basis *and* `wasm32v1-none` to
      # build the corpus in the first place. `RUSTFLAGS` is cleared for the
      # same reason the `gate` job clears it — `-D warnings` is a policy for
      # our code, not for someone else's `cargo install`.
      - name: Provision both harnesses
        run: bash tools/setup-toolchains.sh
        env:
          RUSTFLAGS: ""

      # Built, not vendored. The set is Stellar's `soroban-examples` at a
      # pinned clone, and rebuilding it here keeps the repo from carrying 25
      # more contracts whose only job is to be unfamiliar. `build_heldout.sh`
      # documents the canonical cache path it writes to.
      # The target is added from *inside* the clone on purpose.
      # `setup-toolchains.sh` adds `wasm32v1-none` to toolchain 1.89 alone (the
      # behavior harness it provisions), and `build_heldout.sh` builds each
      # example under whatever `soroban-examples`' own `rust-toolchain.toml`
      # selects — which is not ours and not 1.89. Adding it where the build
      # actually runs is the only placement that covers that.
      - name: Build the held-out corpus
        run: |
          git clone --depth 1 https://github.com/stellar/soroban-examples \
            ~/.cache/soroban-examples
          (cd ~/.cache/soroban-examples && rustup target add wasm32v1-none)
          bash tools/build_heldout.sh ~/.cache/soroban-examples ~/.cache/sordec-heldout

      - name: Score it
        run: |
          cargo test --release -p sordec --test heldout_bench \
            -- --ignored --nocapture
        env:
          SORDEC_HELDOUT_DIR: /home/runner/.cache/sordec-heldout

  publish-readiness:
    name: publish readiness (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Catches the class of manifest defect that blocked publishing for the
      # whole of Phase 4 — internal deps carrying a `path` but no `version`,
      # which a registry rejects outright and a normal build never notices.
      #
      # Only the crates with no internal dependencies can be fully dry-run
      # before anything is published; the rest necessarily fail on
      # "no matching package named …" until their dependencies are live. That
      # is cargo's publish-the-leaves-first ordering, not a defect, so they are
      # checked for manifest validity alone.
      - name: Leaf crates package cleanly
        run: |
          for c in sordec-common sordec-sigs sordec-score sordec-diffexec; do
            echo "::group::$c"
            cargo publish -p "$c" --dry-run --allow-dirty
            echo "::endgroup::"
          done

      - name: Dependent crates have no manifest defects
        run: |
          for c in sordec-ir sordec-frontend sordec-passes sordec-backend sordec-driver sordec; do
            out=$(cargo publish -p "$c" --dry-run --allow-dirty --no-verify 2>&1 || true)
            if grep -q "version requirement specified" <<<"$out"; then
              echo "::error::$c has a path dependency with no version requirement"
              exit 1
            fi
            echo "$c: ok"
          done

      # `cargo publish --dry-run` builds each crate under `target/package/`, and
      # the verification build creates and removes scratch directories inside it
      # (`tests/trybuild`, `tests/target`). `Swatinem/rust-cache`'s post step then
      # walks `target/` and reports every path that vanished underneath it as
      # `ENOENT: … opendir`. Nine such annotations on a green job, all of them
      # noise — but noise on a public release page invites questions that have no
      # answer. The tree is disposable once the checks above have passed, so it
      # goes before anything walks it.
      - name: Discard the dry-run package tree
        if: always()
        run: rm -rf target/package
