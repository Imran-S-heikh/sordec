[package]
name = "sordec"
description = "Decompiler for Soroban smart contracts: WASM in, annotated WAT and Rust out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The package is named for the binary, because `cargo install sordec` is what
# someone reaching for a decompiler will type. The library beside it is the
# embedding entry point — `sordec::Driver` — and the home of the one mapping
# only this package may hold. See `src/lib.rs`.
#
# `[lib]` carries no `name`: it defaults to the package, so the crate is
# `sordec` and callers write `use sordec::Driver`.
[lib]
path = "src/lib.rs"

[[bin]]
name = "sordec"
path = "src/main.rs"

[dependencies]
sordec-common.workspace = true
sordec-backend.workspace = true
# Differential execution for the `score --behavior` path. Pulls a full Soroban host
# into the binary, which is what a behaviour-checking CLI needs; the alternative is a
# flag that cannot answer the question it names.
sordec-diffexec.workspace = true
sordec-driver.workspace = true
sordec-score.workspace = true
sordec-frontend = { workspace = true, features = ["serde"] }
sordec-ir = { workspace = true, features = ["serde"] }
sordec-passes.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# `waffle` is needed by the pretty-printer to pattern-match
# `waffle::Operator::Call` (we render imported-function calls
# differently from default operators). `waffle::Func` is also matched.
waffle.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
# The corpus benchmark harness (tests/benchmark.rs) decompiles + scores the
# fixtures in-memory, so it needs the driver + scorer directly (they are also
# runtime deps above) and serde_json to emit the report.
sordec-driver.workspace = true
sordec-score.workspace = true
serde_json.workspace = true

[lints]
workspace = true
