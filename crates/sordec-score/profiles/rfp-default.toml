# Default scorer weight profile — reproduces the frozen score-1.0.0 weights.
#
# Copy this file, edit the weights, and pass it with `--weights <file>` (T3)
# to reweight categories without recompiling.
#
# Weights are RELATIVE: the aggregator normalizes over the checked categories,
# so they need NOT sum to 1.0 — only their ratios matter. They must each be
# finite and >= 0, with at least one > 0.
#
# Note there is no `compilation` weight. Compilation is a pass/fail GATE, not a
# scored category (T19): it can veto the run's verdict, but it earns no share of
# the mean. A profile still carrying a `compilation` key is rejected outright.
#
# The defaults below are pending Mo/ABS sign-off (SCORER_RULES_INVENTORY C5).

name = "rfp-default"

interface = 0.30
structure = 0.25
semantic  = 0.30
behavior  = 0.15   # inherited from the compilation category it replaced in T19
