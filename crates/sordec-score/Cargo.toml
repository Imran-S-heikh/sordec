[package]
name = "sordec-score"
description = "Source-to-source accuracy scorer (reconstructed Rust vs original)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Pure source-to-source: the scorer parses both sides with `syn` and never
# touches WASM or our IR. It stays decoupled from the pipeline crates on
# purpose — the instrument must be independent of the pipeline it grades.
# `visit` (on top of the workspace's `full`) drives the control-flow
# skeleton walk; features are additive across the workspace.
syn = { workspace = true, features = ["visit"] }
quote.workspace = true
# The contract's declared ABI is XDR in the wasm's `contractspecv0` section and,
# post-expansion, in the SDK's generated `spec_xdr_*` consts. Decoding it is how
# the interface category reads ground truth (T10). This is a third-party format
# library, not one of the pipeline crates the scorer grades — the independence
# rule above is about the latter.
stellar-xdr.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true

[lints]
workspace = true
