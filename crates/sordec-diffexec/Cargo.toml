[package]
name = "sordec-diffexec"
description = "Differential execution harness: original wasm vs recompiled reconstruction"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Host-side execution of contract wasm. A real dependency, not a dev one: running
# both sides in an in-process host *is* this crate's job, so the capability
# belongs to the library rather than to its tests.
#
# The `testutils` feature is what provides `Env`, registration from raw wasm
# bytes, and the auth/event/ledger introspection the comparison reads. Carrying a
# `testutils` feature outside `[dev-dependencies]` is unusual and deliberate —
# the harness is a test host.
#
# CORRECTION (measured 2026-07-28). This was a dev-dependency because the
# manifest claimed promoting it "will break `gate.sh`": step 2 runs
# `RUSTFLAGS="-D warnings" cargo build --release --workspace`, RUSTFLAGS reaches
# dependencies, and the host graph vendors a 2023-vintage `soroban-wasmi`. That
# reasoning was wrong. Cargo applies `--cap-lints allow` to registry
# dependencies, so RUSTFLAGS cannot fail them —
# `RUSTFLAGS="-D warnings" cargo build --release -p sordec-diffexec --tests`
# builds `soroban-env-host 23.0.1` and `soroban-wasmi 0.31.1-soroban.20.0.1`
# clean. The breakage actually observed during B1 was `ed25519-dalek`'s
# `CryptoRng` bound, which is a hard compile error rather than a lint and is
# already fixed by the lockfile pin below.
#
# That pin is the constraint that IS real: `soroban-env-host` declares
# `ed25519-dalek = ">=2.0.0"` unbounded across majors, so only the committed
# `Cargo.lock` holds it at 2.x. See the workspace manifest for the full
# explanation and the restore command; `tests/lockfile.rs` guards it.
soroban-sdk.workspace = true

# Reading which artifact cargo produced. `cargo build --message-format=json`
# reports the wasm path on stdout, and that is the only authoritative answer:
# scanning the target directory instead breaks the moment two crates share one
# (which the vector corpus does deliberately, so soroban-sdk is built once rather
# than eighteen times), and deriving the filename from the package name means
# hand-parsing a manifest.
#
# A third-party format library, not one of the pipeline crates this harness
# executes — the independence rule below is about the latter. `sordec-score` draws
# the same line for `stellar-xdr`.
serde_json.workspace = true

# Nothing else, on purpose. The harness takes primitives (an `rssdkver` string, a
# protocol string) rather than `sordec_ir::SorobanFacts`, so it stays decoupled
# from the pipeline whose output it executes — the same independence rule
# `sordec-score` follows. Callers do the extraction.

[lints]
workspace = true
