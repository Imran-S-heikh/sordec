[package]
name = "sordec-backend"
description = "Code emitters (annotated WAT and compilable Rust)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sordec-common.workspace = true
sordec-ir.workspace = true
# The WAT emitter reads the host-call catalog (`resolve_host_call`) to
# label `call` sites with their friendly names by callee identity. This
# is an acyclic dependency (passes never depends on backend); it trades
# the plan's "backend → ir only" aspiration for sound, catalog-backed
# inline naming instead of raw `module::name`.
sordec-passes.workspace = true
wasmprinter.workspace = true
thiserror.workspace = true
# Reserved for the Phase 4 Rust emitter (kept declared; unused by the WAT path).
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
prettyplease.workspace = true

[dev-dependencies]
# Test-only: parse fixtures into `WasmFacts` and rescan the original code
# section to validate the printed-WAT ⇆ binary call-order invariant; `wat`
# re-parses emitted annotated WAT for the K5 acceptance gates.
sordec-frontend.workspace = true
wasmparser.workspace = true
wat.workspace = true
# Test-only: parse the `Cargo.toml` we emit, so a malformed manifest is caught
# here rather than by a `cargo build` failure much further downstream. The
# manifest carries provenance comments and a multi-line dependency block, which
# substring assertions cannot prove well-formed.
toml.workspace = true
# The Rust-emit corpus gate re-parses emitted `src/lib.rs` to assert it is
# syntactically valid Rust (the structural analogue of the WAT parse gate).
syn.workspace = true

[lints]
workspace = true
